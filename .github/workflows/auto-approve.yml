name: Auto Approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto_approve:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    env:
      AUTO_APPROVE_TOKEN: ${{ secrets.AUTO_APPROVE_TOKEN }}
    steps:
      - name: Auto Approve
        if: ${{ env.AUTO_APPROVE_TOKEN != '' }}
        uses: hmarr/auto-approve-action@v4.0.0
        with:
          github-token: ${{ env.AUTO_APPROVE_TOKEN }}
      - name: Skip when no approval token is configured
        if: ${{ env.AUTO_APPROVE_TOKEN == '' }}
        run: echo "AUTO_APPROVE_TOKEN is not configured; skipping auto-approval."
