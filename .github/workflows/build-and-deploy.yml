name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # for GHCR if used

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push by default)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kyzen:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test container
        run: |
          docker run -d --name kyzen-smoke -p 3000:3000 \
            -e DATABASE_URL="postgresql://ci:ci@localhost:5432/clarion?schema=public" \
            kyzen:local || true
          sleep 5
          docker logs kyzen-smoke || true
          docker rm -f kyzen-smoke || true

  # Optional: push to GitHub Container Registry when on main or release
  # Uncomment and set secrets if you want automatic image publishing
  # docker-push:
  #   needs: docker-build
  #   if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
  #   runs-on: ubuntu-latest
  #   steps: ...
