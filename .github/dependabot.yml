version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Freeze major updates during sale / handoff window
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Freeze major updates during sale / handoff window
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
